version: "3.9"
services:
  backend:
    build: ./backend
    environment:
      API_TOKEN: ${API_TOKEN}
      TEMP_DIR: /tmp/pptx
      FILE_TTL_MINUTES: 60
      MAX_UPLOAD_SIZE_MB: 25
    volumes:
      - ./tmp:/tmp/pptx
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
      NEXT_PUBLIC_API_TOKEN: ${API_TOKEN}
    depends_on:
      - backend
    ports:
      - "3000:3000"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
